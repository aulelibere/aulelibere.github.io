name: Aggiorna orari e pubblica

on:
  schedule:
    # Un tentativo ogni 30 minuti, dalle 6:07 alle 20:37 ora italiana d'inverno (7:07–21:37 d'estate). Orari in UTC.
    # GitHub può ritardare o saltare le esecuzioni: si aggiorna solo se i dati di oggi hanno almeno 110 minuti.
    - cron: '7,37 5-19 * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  dati:
    runs-on: ubuntu-latest
    outputs:
      aggiorna: ${{ steps.controllo.outputs.aggiorna }}
    permissions:
      contents: write     # solo per il commit mensile che tiene attiva la pianificazione
      actions: read
    steps:
      - uses: actions/checkout@v7

      # Nelle esecuzioni pianificate, se i dati di oggi sono recenti ci si ferma qui.
      # Push e avvii manuali pubblicano sempre. Se il controllo non riesce, si aggiorna.
      - name: Controlla se serve aggiornare
        id: controllo
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          aggiorna=si
          if [ "$EVENTO" = "schedule" ]; then
            oggi=$(TZ=Europe/Rome date +%F)
            generato=$(curl -fsS --max-time 15 https://aulelibere.github.io/UdA-Pescara/data/indice.json \
              | jq -r --arg g "$oggi" '.giorni[] | select(.giorno == $g) | (.generato / 1000 | floor)') || generato=""
            if [[ "$generato" =~ ^[0-9]+$ ]]; then
              eta=$(( ($(date +%s) - generato) / 60 ))
              echo "Dati di oggi generati $eta minuti fa."
              if [ "$eta" -lt 110 ]; then aggiorna=no; fi
            else
              echo "Dati di oggi non trovati."
            fi
          fi
          echo "Aggiornare: $aggiorna"
          echo "aggiorna=$aggiorna" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.controllo.outputs.aggiorna == 'si'
        with:
          node-version: 22

      - name: Prepara il sito
        if: steps.controllo.outputs.aggiorna == 'si'
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' --exclude '_site' ./ _site/

      - name: Scarica gli orari dall'università
        if: steps.controllo.outputs.aggiorna == 'si'
        # se fallisce il sito viene pubblicato lo stesso: l'app ripiega sulle richieste dirette
        continue-on-error: true
        run: node scripts/aggiorna-dati.mjs _site/UdA-Pescara "https://aulelibere.github.io/UdA-Pescara/"

      - uses: actions/upload-pages-artifact@v5
        if: steps.controllo.outputs.aggiorna == 'si'
        with:
          path: _site

      # GitHub sospende le esecuzioni pianificate dopo 60 giorni senza modifiche al repository:
      # una volta al mese aggiorno un file per evitarlo.
      - name: Mantieni attiva la pianificazione
        if: github.event_name == 'schedule'
        run: |
          mese=$(TZ=Europe/Rome date +%Y-%m)
          if [ "$(cat .github/attivo 2>/dev/null)" != "$mese" ]; then
            echo "$mese" > .github/attivo
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add .github/attivo
            git commit -m "Pianificazione attiva ($mese)"
            git push
          fi

  pubblica:
    needs: dati
    if: needs.dati.outputs.aggiorna == 'si'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
